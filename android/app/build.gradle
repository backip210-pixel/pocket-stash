plugins {
    id 'com.android.application'
}

// Release credentials are supplied by the build environment, never the repo.
def pocketKeystorePath = System.getenv('POCKET_STASH_KEYSTORE')
def pocketSigningPassword = System.getenv('POCKET_STASH_SIGNING_PASSWORD')

android {
    namespace 'app.pocketstash.companion'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'app.pocketstash.companion'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
    }

    signingConfigs {
        release {
            if (pocketKeystorePath && pocketSigningPassword) {
                storeFile file(pocketKeystorePath)
                storePassword pocketSigningPassword
                keyAlias 'pocket-stash'
                keyPassword pocketSigningPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/pocket-assets'))
}

// Fail closed rather than silently producing an unsigned release APK.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!pocketKeystorePath || !pocketSigningPassword) {
            throw new GradleException('Release signing needs POCKET_STASH_KEYSTORE and POCKET_STASH_SIGNING_PASSWORD.')
        }
        if (!file(pocketKeystorePath).isFile()) {
            throw new GradleException('The release keystore file does not exist.')
        }
    }
}

// Build the embedded Termux companion directly from the tracked source files.
// This keeps the APK and repository in sync; no separate binary payload is checked in.
tasks.register('bundleCompanion', Zip) {
    archiveFileName = 'companion.zip'
    destinationDirectory = layout.buildDirectory.dir('generated/pocket-assets')
    from(rootProject.file('../server.py'))
    from(rootProject.file('../performer_workflow.py'))
    from(rootProject.file('../web')) {
        include 'index.html', 'style.css', 'app.js', 'favicon.svg'
        into 'web'
    }
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('preBuild').configure { dependsOn(tasks.named('bundleCompanion')) }

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
