name: Build and publish signed release

on:
  push:
    branches:
      - main

# Required to create a version tag and publish the GitHub Release and assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main-branch source and history
        uses: actions/checkout@v4
        with:
          # Validate the tracked version against previously published tags.
          fetch-depth: 0
      - name: Validate the tracked release version
        run: python3 tools/release_version.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package was removed from Google's repository.
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare private signing key
        shell: bash
        env:
          ENCODED_KEYSTORE: ${{ secrets.POCKET_STASH_RELEASE_KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.POCKET_STASH_RELEASE_PASSWORD }}
        run: |
          if [[ -z "$ENCODED_KEYSTORE" || -z "$SIGNING_PASSWORD" ]]; then
            echo "::error::Release signing secrets are missing. See README.md."
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/pocket-stash-release.p12"
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$key_file"
          if [[ ! -s "$key_file" ]]; then
            echo "::error::The release keystore is empty or invalid."
            exit 1
          fi
          echo "POCKET_STASH_KEYSTORE=$key_file" >> "$GITHUB_ENV"
      - name: Test Termux companion
        run: python3 -m unittest discover -s tests -v
      - name: Test, lint and assemble signed release APK
        working-directory: android
        env:
          POCKET_STASH_SIGNING_PASSWORD: ${{ secrets.POCKET_STASH_RELEASE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Verify and package release APK
        shell: bash
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          signing_info=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk")
          printf '%s\n' "$signing_info"
          actual_cert=$(printf '%s\n' "$signing_info" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          expected_cert=$(tr -d '[:space:]' < android/release-certificate.sha256)
          if [[ ! "$expected_cert" =~ ^[a-f0-9]{64}$ || "$actual_cert" != "$expected_cert" ]]; then
            echo "::error::The release certificate changed. Restore the original key to preserve updates."
            exit 1
          fi
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | sed -n '1p')
          if [[ "$badging" != *"name='app.pocketstash.companion'"* || "$badging" != *"versionCode='$POCKET_STASH_VERSION_CODE'"* || "$badging" != *"versionName='$POCKET_STASH_VERSION_NAME'"* ]]; then
            echo "::error::The APK package or version does not match the tracked release version."
            exit 1
          fi
          mkdir -p release-output
          cp "$apk" "release-output/$RELEASE_APK_NAME"
          (cd release-output && sha256sum "$RELEASE_APK_NAME" > SHA256SUMS.txt)
      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Stash-signed-release
          path: release-output/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pre-existing tag must point to this exact commit. Never overwrite
          # a published release; an interrupted draft can safely be retried.
          git fetch --tags --quiet origin
          existing_commit=$(git rev-parse --verify -q "refs/tags/${RELEASE_TAG}^{commit}" || true)
          if [[ -n "$existing_commit" && "$existing_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::The calculated tag already identifies a different commit."
            exit 1
          fi
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [[ "$existing" == "false" ]]; then
            echo "::error::This release is already published; refusing to replace it."
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft \
              --title "Pocket Stash $RELEASE_TAG" \
              --notes-file .github/release-notes.md --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-output/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pocket-stash-release.p12"
