name: Build and publish signed release

on:
  push:
    tags:
      - 'v*'

# Required to publish this tag's GitHub Release and its assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
      - name: Verify release tag matches Android version
        shell: bash
        run: |
          version=$(sed -n "s/^[[:space:]]*versionName ['\"]\([^'\"]*\)['\"].*/\1/p" android/app/build.gradle | head -n 1)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::The tag must be v followed by the Android versionName."
            exit 1
          fi
          echo "RELEASE_APK_NAME=Pocket-Stash-${GITHUB_REF_NAME}.apk" >> "$GITHUB_ENV"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package was removed from Google's repository.
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Prepare private signing key
        shell: bash
        env:
          ENCODED_KEYSTORE: ${{ secrets.POCKET_STASH_RELEASE_KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.POCKET_STASH_RELEASE_PASSWORD }}
        run: |
          if [[ -z "$ENCODED_KEYSTORE" || -z "$SIGNING_PASSWORD" ]]; then
            echo "::error::Release signing secrets are missing. See README.md."
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/pocket-stash-release.p12"
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$key_file"
          if [[ ! -s "$key_file" ]]; then
            echo "::error::The release keystore is empty or invalid."
            exit 1
          fi
          echo "POCKET_STASH_KEYSTORE=$key_file" >> "$GITHUB_ENV"
      - name: Test Termux companion
        run: python3 -m unittest discover -s tests -v
      - name: Test, lint and assemble signed release APK
        working-directory: android
        env:
          POCKET_STASH_SIGNING_PASSWORD: ${{ secrets.POCKET_STASH_RELEASE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Verify and package release APK
        shell: bash
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p release-output
          cp "$apk" "release-output/$RELEASE_APK_NAME"
          (cd release-output && sha256sum "$RELEASE_APK_NAME" > SHA256SUMS.txt)
      - name: Upload release build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Stash-signed-release
          path: release-output/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Retry a draft after an interrupted upload, but never overwrite an
          # already-published release under an existing version tag.
          existing=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null || true)
          if [[ "$existing" == "false" ]]; then
            echo "::error::This release is already published. Bump the version and use a new tag."
            exit 1
          fi
          if [[ -z "$existing" ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --prerelease \
              --title "Pocket Stash $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-output/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/pocket-stash-release.p12"
