name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package was removed; the action's default
          # package list still requests it. Install only supported packages.
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test Termux companion
        run: python3 -m unittest discover -s tests -v
      - name: Test, lint and assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug
      # Debug builds are tested but not distributed: their ephemeral key would
      # conflict with the stable release key. Install from GitHub Releases.
